# dsh-mail-remote: 通过邮箱远程驱动 DSH。
#
# 安装后本行随包生效，但默认 disabled：不会连邮箱、不会起会话。
# 把 enabled 改成 true 并填好 user / allowFrom / subjectToken 才会工作。
#
# 推荐把真实配置写在 profile 的 cordis.patch.yml（后加载的层会覆盖本行）：
#
#   - id: mail-remote
#     config:
#       enabled: true
#       provider: qq
#       user: you@qq.com
#       passwordFile: ~/.dsh-secrets/qq-mail.pass
#       allowFrom: [you@qq.com]
#       subjectToken: "[DSH-7f3a]"
#       workdir: ~/DSH-Remote
#
# password 也可以走环境变量 DSH_MAIL_REMOTE_PASSWORD（推荐，避免明文落盘）。
- insert:
    - id: mail-remote
      name: dsh-mail-remote
      config:
        enabled: false
